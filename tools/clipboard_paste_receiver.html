<!doctype html>
<meta charset="utf-8">
<title>SeriousShot actual paste receiver</title>
<style>body{font:16px system-ui;padding:24px;max-width:1000px}textarea{width:95%;height:80px}pre{white-space:pre-wrap}</style>
<h1>Actual clipboard paste</h1>
<p>Local-only diagnostic. Focus below and press Cmd+V / Ctrl+V. Reads the File supplied by the real paste event; does not fetch a source/cache file or upload anything.</p>
<label for="paste">Paste target</label><br><textarea id="paste" autofocus></textarea>
<pre id="result">Waiting for paste</pre>
<script>
const results = [];
document.querySelector('#paste').addEventListener('paste', async event => {
  event.preventDefault();
  const files = [...event.clipboardData.files];
  const result = {types:[...event.clipboardData.types], files:[], trusted:event.isTrusted};
  for (const file of files) {
    const buf = await file.arrayBuffer(), bytes = new Uint8Array(buf);
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
    const info = {name:file.name, mime:file.type, bytes:file.size,
      sha256:[...hash].map(n=>n.toString(16).padStart(2,'0')).join('')};
    if (bytes[0]===137 && bytes[1]===80 && bytes[2]===78 && bytes[3]===71) {
      info.bitDepth=bytes[24]; info.colorType=bytes[25]; info.chunks=[];
      const view = new DataView(buf);
      for(let offset=8;offset+12<=bytes.length;) {
        const length=view.getUint32(offset), end=offset+length+12;
        if(end>bytes.length) throw new Error('Truncated PNG');
        const type=String.fromCharCode(...bytes.slice(offset+4,offset+8));
        info.chunks.push(type);
        if(type==='cICP') info.cICP=[...bytes.slice(offset+8,offset+8+length)];
        offset=end;
      }
    } else if(bytes[0]===255 && bytes[1]===216) {
      const text=new TextDecoder('latin1').decode(bytes);
      info.iso21496=text.includes('urn:iso:std:iso:ts:21496:-1');
      info.iccCount=text.split('ICC_PROFILE').length-1;
      info.jpegStartCount=0;
      for(let n=0;n+2<bytes.length;n++)
        if(bytes[n]===255 && bytes[n+1]===216 && bytes[n+2]===255) info.jpegStartCount++;
    }
    result.files.push(info);
  }
  results.push(result);
  document.querySelector('#result').textContent=JSON.stringify(result);
});
</script>
